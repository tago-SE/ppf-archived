
trigger:
  branches:
    include:
      - '*'
  paths:
    include:
      # Modify or remove per your need
      - templates/content/01-react-aspnetcore-portal/WebPortal/*

pool:
  vmImage: ubuntu-latest

variables:
  tag: '$(Build.BuildId)'
  imageName: react-cms-portal
  azureSubscription: 'AISPPAT Partner Portal Framework Test auto'
  containerRegistryName: ifppfprodcr
  # Set to the location of where this pipeline is located in the project repo
  projectSolutionDir:  'templates/content/01-react-aspnetcore-portal/WebPortal'
  snykServiceConnectionEndpoint: snyk-iam-h-apiauthhub
  
stages:
  - stage: BuildPortal
    displayName: Build Portal image
    jobs:
    - job: BuildPortal
      condition: succeededOrFailed()
      displayName: Build
      steps:
      - task: AzureCLI@2
        displayName: 'Build and Push Container Image'
        inputs: 
          azureSubscription: $(azureSubscription)
          scriptType: pscore
          scriptLocation: inlineScript
          inlineScript: |
            $token = $(az acr login --name $(containerRegistryName) --expose-token --output tsv --query accessToken)
            docker login $(containerRegistryName).azurecr.io --username 00000000-0000-0000-0000-000000000000 --password $token
            docker image build ./$(projectSolutionDir) -f $(Build.SourcesDirectory)/$(projectSolutionDir)/WebPortal.Server/Dockerfile -t $(containerRegistryName).azurecr.io/$(imageName):$(tag) -t $(containerRegistryName).azurecr.io/$(imageName):latest
            docker image push $(containerRegistryName).azurecr.io/$(imageName):$(tag)
            docker image push $(containerRegistryName).azurecr.io/$(imageName):latest
          workingDirectory: $(Build.SourcesDirectory)

           # Required
      - powershell: |
          Write-Host "Setting global variable SNYK_API "
          $SNYK_API = "https://app.eu.snyk.io/api"
          Write-Host "##vso[task.setvariable variable=SNYK_API;isOutput=false]$SNYK_API"
        displayName: 'Set SNYK API'

      - powershell: |
          Write-Host "Setting global variable SNYK_CFG_ORG "
          $SNYK_CFG_ORG = "96e36b4d-ac07-497e-8a93-4e51ee7aff1a"
          Write-Host "##vso[task.setvariable variable=SNYK_CFG_ORG;isOutput=false]$SNYK_CFG_ORG"
        displayName: 'Set SNYK ORG'

      - task: SnykSecurityScan@1
      # https://dev.azure.com/if-it/common-architecture-and-platforms/_git/ci-cd-templates?path=/templates/security/snyk
      # https://dev.azure.com/if-it/_search?action=contents&text=SnykSecurityScan%401&type=code&lp=custom-Collection&filters=&pageSize=25&result=DefaultCollection/common-architecture-and-platforms/ci-cd-templates/GBmain//templates/security/snyk/snyk.yml
        displayName: 'Snyk app scan'
        inputs:
          serviceConnectionEndpoint: '$(snykServiceConnectionEndpoint)'
          testType: 'app'
          monitorWhen: 'always'
          failOnIssues: true
          # projectName: 'Partner Portal Framework/if-ppf-templates'
          testDirectory: '$(Build.SourcesDirectory)/templates/content/01-react-aspnetcore-portal'
          additionalArguments: "--all-projects"

      # TODO: Need fix
      # https://docs.snyk.io/integrate-with-snyk/container-security-integrations
      # - task: SnykSecurityScan@1
      #   displayName: 'Snyk container scan'
      #   inputs:
      #     serviceConnectionEndpoint: '$(snykServiceConnectionEndpoint)'
      #     testType: 'container'
      #     dockerImageName: 'tempName'
      #     dockerfilePath: '$(Build.SourcesDirectory)/$(projectSolutionDir)/WebPortal.Server/Dockerfile'
      #     monitorWhen: 'always'
      #     failOnIssues: true

  - stage: DeployDev 
    displayName: Deploy Portal Dev
    dependsOn: BuildPortal
    variables:
      - group: ppf-template-01
    jobs:
      - deployment: Deploy
        environment: If-PPF-Partners-Dev
        strategy:
          runOnce:
            deploy:
              steps:
              - task: AzureCLI@2
                inputs:
                  azureSubscription: $(azureSubscription)
                  scriptType: "pscore"
                  scriptLocation: "inlineScript"
                  failOnStandardError: false
                  inlineScript: |
                      az extension remove -n containerapp
                      az extension add -n containerapp --upgrade --allow-preview false
                      Write-Host "Getting existing resource values"

                      $identity = (az identity show  --resource-group $(Infrastructure.ResourceGroupName) --name $(Infrastructure.ContainerIdentityName) | convertfrom-json)
                      [string] $clientId = $identity.clientId
                      [string] $principalId = $identity.principalId
                      Write-Host "ClientId: $($clientId)"
                      Write-Host "PrincipalId: $principalId"

                      [string] $appiConnectionString = (az monitor app-insights component show --resource-group $(Infrastructure.ResourceGroupName) --app $(Infrastructure.AppInsightsName) | convertfrom-json).connectionString
                      Write-Host "appiConnectionString: $appiConnectionString"

                      $jsonBody = @"
                      {
                          "properties": {
                              "configuration": {
                                  "registries": [
                                      {
                                          "identity": "/subscriptions/$(Infrastructure.SubscriptionId)/resourceGroups/$(Infrastructure.ResourceGroupName)/providers/Microsoft.ManagedIdentity/userAssignedIdentities/$(Infrastructure.ContainerRegistryIdentityName)",
                                          "server": "$(containerRegistryName).azurecr.io",
                                          "passwordSecretRef": "",
                                          "username": ""
                                      }
                                  ],
                                  "secrets": [
                                      # {
                                      #     "name": "key-vault-hard-name",
                                      #     "identity": "/subscriptions/$(Infrastructure.SubscriptionId)/resourcegroups/$(Infrastructure.ResourceGroupName)/providers/Microsoft.ManagedIdentity/userAssignedIdentities/$(Infrastructure.ContainerIdentityName)",
                                      #     "keyVaultUrl": "https://$(KeyVault.Name).vault.azure.net/secrets/SuperSecretKey"
                                      # },
                                      {
                                          "name": "appi-secret",
                                          "value": "$appiConnectionString"
                                      }
                                  ]
                              },
                              "template": {
                                  "containers": [
                                      {
                                          "image": "$(containerRegistryName).azurecr.io/$(imageName):$(build.buildid)",
                                          "name": "$(Infrastructure.ContainerAppName)"
                                      }
                                  ]
                              }
                          }
                      }
                      "@

                      Write-Host "Setting secrets"
                      az rest --method patch `
                      --url "/subscriptions/$(Infrastructure.SubscriptionId)/resourceGroups/$(Infrastructure.ResourceGroupName)/providers/Microsoft.App/containerApps/$(Infrastructure.ContainerAppName)?api-version=$(Infrastructure.AzureCliApiVersion)" `
                      --headers Content-Type=application/json `
                      --body $jsonBody
                      
                      if ($LASTEXITCODE -ne 0) {
                        Write-Error "Error occurred during az rest command."
                        exit $LASTEXITCODE
                      }

                      Write-Host "Patch done"
                      (az containerapp show --resource-group $(Infrastructure.ResourceGroupName) --name $(Infrastructure.ContainerAppName) | convertfrom-json).properties.provisioningState
                      (az containerapp show --resource-group $(Infrastructure.ResourceGroupName) --name $(Infrastructure.ContainerAppName) | convertfrom-json).properties.runningstatus
                      start-sleep 30

                      Write-Host "Adding env variables"
                      az containerapp update `
                      --name $(Infrastructure.ContainerAppName) `
                      --resource-group $(Infrastructure.ResourceGroupName) `
                      --set-env-vars `
                      Application__Identity__ClientId=$clientId `
                      Application__Identity__ObjectId=$principalId `
                      Application__Host=$(Application.Host) `
                      Build__BuildId=$(build.buildid) `
                      Build__BuildNumber=$(build.buildNumber) `
                      ApplicationInsights__ConnectionString=secretref:appi-secret `
                      Redis__UserName=$principalId `
                      Redis__HostName=$(Redis.HostName) `
                      Redis__KeyPrefix=$(Redis.KeyPrefix) `
                      Redis__Port=$(Redis.Port)
                      if ($LASTEXITCODE -ne 0) {
                        Write-Error "Error occurred during az rest command."
                        exit $LASTEXITCODE
                      }

                      Write-Host "Environment variables updated"
                      (az containerapp show --resource-group $(Infrastructure.ResourceGroupName) --name $(Infrastructure.ContainerAppName) | convertfrom-json).properties.provisioningState
                      (az containerapp show --resource-group $(Infrastructure.ResourceGroupName) --name $(Infrastructure.ContainerAppName) | convertfrom-json).properties.runningstatus
                      start-sleep 20
                      (az containerapp show --resource-group $(Infrastructure.ResourceGroupName) --name $(Infrastructure.ContainerAppName) | convertfrom-json).properties.provisioningState
                      (az containerapp show --resource-group $(Infrastructure.ResourceGroupName) --name $(Infrastructure.ContainerAppName) | convertfrom-json).properties.runningstatus

                      Write-Host "Checking latest revision status"
                      $activeRevisions = az containerapp revision list --resource-group $(Infrastructure.ResourceGroupName) --name $(Infrastructure.ContainerAppName) | ConvertFrom-Json
                      $latestRevision = $activeRevisions | Sort-Object { [datetime]$_.properties.createdTime } -Descending | Select-Object -First 1
                      $latestRevision | Format-List
                      if ($latestRevision.properties.provisioningState -eq 'Failed') {
                          Write-Host "Provisioning state of the latest revision is: Failed"
                          exit 1
                      } else {
                          Write-Host "Provisioning state of the latest revision is: $($latestRevision.properties.provisioningState)"
                      }


