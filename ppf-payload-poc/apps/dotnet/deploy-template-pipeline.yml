parameters:
- name: variableGroupName
  type: string
- name: serviceConnectionName
  type: string
- name: containerRegistryName
  type: string
- name: dockerTag
  type: string
- name: dockerfilePath
  type: string
- name: containerImageName
  type: string
- name: environmentName
  type: string
- name: azureCliApiVersion
  type: string
- name: appInsightsName
  type: string
- name: containerAppName
  type: string
- name: containerIdentityName
  type: string
- name: containerRegistryIdentityName
  type: string
- name: containerResourceGroupName
  type: string
- name: containerSubscriptionId
  type: string

jobs:
- job: Build
  displayName: Build and Push Image
  variables:
    - group: ${{ parameters.variableGroupName }}
  steps:
    - task: AzureCLI@2
      displayName: "Build and Push Container Image"
      env:
        SYSTEM_ACCESSTOKEN: $(System.AccessToken)
      inputs:
        azureSubscription: ${{ parameters.serviceConnectionName }}
        scriptType: pscore
        scriptLocation: inlineScript
        inlineScript: |
          $token = $(az acr login --name ${{ parameters.containerRegistryName }} --expose-token --output tsv --query accessToken)
          docker login ${{ parameters.containerRegistryName }}.azurecr.io --username 00000000-0000-0000-0000-000000000000 --password $token
          docker image build . -f ${{ parameters.dockerfilePath }} --secret id=sytemauthtoken,env=SYSTEM_ACCESSTOKEN -t ${{ parameters.containerRegistryName }}.azurecr.io/${{ parameters.containerImageName }}:${{ parameters.dockerTag }} -t ${{ parameters.containerRegistryName }}.azurecr.io/${{ parameters.containerImageName }}:latest --build-arg VITE_SERVER_URL=$(Application.Host) --build-arg VITE_CMS_URL=$(Payload.Host) --build-arg VITE_TENANT_SLUG=$(Payload.TenantSlug)
          docker image push ${{ parameters.containerRegistryName }}.azurecr.io/${{ parameters.containerImageName }}:${{ parameters.dockerTag }} 
          docker image push ${{ parameters.containerRegistryName }}.azurecr.io/${{ parameters.containerImageName }}:latest

- deployment: Deploy
  displayName: Deploy
  dependsOn: Build
  condition: succeeded()
  environment: ${{ parameters.environmentName }}
  variables:
    - group: ${{ parameters.variableGroupName }}
  strategy:
    runOnce:
      deploy:
        steps:
          - task: AzureCLI@2
            inputs:
              azureSubscription: ${{ parameters.serviceConnectionName }}
              scriptType: "pscore"
              scriptLocation: "inlineScript"
              failOnStandardError: false
              inlineScript: |
                az extension remove -n containerapp
                az extension add -n containerapp --upgrade --allow-preview false
                Write-Host "Getting existing resource values"

                $identity = (az identity show  --resource-group ${{ parameters.containerResourceGroupName }} --name ${{ parameters.containerIdentityName }} | convertfrom-json)
                [string] $clientId = $identity.clientId
                [string] $principalId = $identity.principalId
                Write-Host "ClientId: $($clientId)"
                Write-Host "PrincipalId: $principalId"
                [string] $appiConnectionString = (az monitor app-insights component show --resource-group ${{ parameters.containerResourceGroupName }} --app ${{ parameters.appInsightsName }} | convertfrom-json).connectionString
                Write-Host "appiConnectionString: $appiConnectionString"

                $jsonBody = @"
                {
                    "properties": {
                        "configuration": {
                            "registries": [
                                {
                                    "identity": "/subscriptions/${{ parameters.containerSubscriptionId}}/resourceGroups/${{ parameters.containerResourceGroupName }}/providers/Microsoft.ManagedIdentity/userAssignedIdentities/${{ parameters.containerRegistryIdentityName }}",
                                    "server": "${{ parameters.containerRegistryName }}.azurecr.io",
                                    "passwordSecretRef": "",
                                    "username": ""
                                }
                            ],
                            "secrets": [
                                # {
                                #     "name": "key-vault-hard-name",
                                #     "identity": "/subscriptions/${{ parameters.containerSubscriptionId}}/resourcegroups/${{ parameters.containerResourceGroupName }}/providers/Microsoft.ManagedIdentity/userAssignedIdentities/${{ parameters.containerIdentityName }}",
                                #     "keyVaultUrl": "https://$(KeyVault.Name).vault.azure.net/secrets/some-secret"
                                # }
                            ]
                        },
                        "template": {
                            "containers": [
                                {
                                    "image": "${{ parameters.containerRegistryName }}.azurecr.io/${{ parameters.containerImageName }}:${{ parameters.dockerTag }}",
                                    "name": "${{ parameters.containerAppName }}"
                                }
                            ]
                        }
                    }
                }
                "@

                Write-Host "Setting secrets"
                az rest --method patch `
                --url "/subscriptions/${{ parameters.containerSubscriptionId}}/resourceGroups/${{ parameters.containerResourceGroupName }}/providers/Microsoft.App/containerApps/${{ parameters.containerAppName }}?api-version=${{ parameters.azureCliApiVersion}}" `
                --headers Content-Type=application/json `
                --body $jsonBody

                if ($LASTEXITCODE -ne 0) {
                  Write-Error "Error occurred during az rest command."
                  exit $LASTEXITCODE
                }

                Write-Host "Patch done"
                (az containerapp show --resource-group ${{ parameters.containerResourceGroupName }} --name ${{ parameters.containerAppName }} | convertfrom-json).properties.provisioningState
                (az containerapp show --resource-group ${{ parameters.containerResourceGroupName }} --name ${{ parameters.containerAppName }} | convertfrom-json).properties.runningstatus
                start-sleep 30

                Write-Host "Adding env variables"
                az containerapp update `
                --name ${{ parameters.containerAppName }} `
                --resource-group ${{ parameters.containerResourceGroupName }} `
                --set-env-vars `
                Application__Identity__ClientId=$clientId `
                Application__Identity__ObjectId=$principalId `
                Application__Host=$(Application.Host) `
                Build__BuildId=$(build.buildid) `
                Build__BuildNumber=$(build.buildNumber) `
                ApplicationInsights__ConnectionString=$appiConnectionString `
                ReverseProxy__Clusters__cluster1__Destinations__destination1__Address=$(Payload.Host) `
                Payload__Host=$(Payload.Host) `
                Payload__TenantSlug=$(Payload.TenantSlug) `
                Redis__UserName=$principalId `
                Redis__HostName=$(Redis.HostName) `
                Redis__KeyPrefix=$(Redis.KeyPrefix) `
                Redis__Port=$(Redis.Port)
                if ($LASTEXITCODE -ne 0) {
                  Write-Error "Error occurred during az rest command."
                  exit $LASTEXITCODE
                }

                Write-Host "Environment variables updated"
                (az containerapp show --resource-group ${{ parameters.containerResourceGroupName }} --name ${{ parameters.containerAppName }} | convertfrom-json).properties.provisioningState
                (az containerapp show --resource-group ${{ parameters.containerResourceGroupName }} --name ${{ parameters.containerAppName }} | convertfrom-json).properties.runningstatus
                start-sleep 20
                (az containerapp show --resource-group ${{ parameters.containerResourceGroupName }} --name ${{ parameters.containerAppName }} | convertfrom-json).properties.provisioningState
                (az containerapp show --resource-group ${{ parameters.containerResourceGroupName }} --name ${{ parameters.containerAppName }} | convertfrom-json).properties.runningstatus

                Write-Host "Checking latest revision status"
                $activeRevisions = az containerapp revision list --resource-group ${{ parameters.containerResourceGroupName }} --name ${{ parameters.containerAppName }} | ConvertFrom-Json
                $latestRevision = $activeRevisions | Sort-Object { [datetime]$_.properties.createdTime } -Descending | Select-Object -First 1
                $latestRevision | Format-List
                if ($latestRevision.properties.provisioningState -eq 'Failed') {
                    Write-Host "Provisioning state of the latest revision is: Failed"
                    exit 1
                } else {
                    Write-Host "Provisioning state of the latest revision is: $($latestRevision.properties.provisioningState)"
                }
