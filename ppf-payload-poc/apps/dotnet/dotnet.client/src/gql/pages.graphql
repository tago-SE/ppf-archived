#import "./fragments/pageBaseFragment.graphql"
#import "./fragments/productPageFragment.graphql"
#import "./fragments/landingPageFragment.graphql"
#import "./fragments/articlePageFragment.graphql"
#import "./fragments/standardPageFragment.graphql"
#import "./fragments/documentationPageFragment.graphql"

query Page($tenantSlug: String!, $pageSlug: String, $locale: LocaleInputType, $draftMode: Boolean!){
    PagesByTenant(tenantSlug: $tenantSlug, where: { slug: { equals: $pageSlug } }, locale: $locale, draftMode: $draftMode) {
        docs {
            ...PageBase
        }
    }
}

query DocumentationPage($tenantSlug: String!, $pageSlug: String, $locale: LocaleInputType, $draftMode: Boolean!){
    DocumentationPagesByTenant(tenantSlug: $tenantSlug, where: { slug: { equals: $pageSlug } }, locale: $locale, draftMode: $draftMode) {
        docs {
            ...PageBase
            ...DocumentationPageDetails
        }
    }
}

